<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Ferrodistribuciones · Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#eceff3; --surface:#fff; --surface-2:#f4f6f9; --ink:#17212b; --muted:#566371; --line:#d3dae2;
  --accent:#c9282f; --accent-ink:#fff; --accent-soft:#fbe3e3;
  --brand-black:#111111; --brand-red:#e5333a; --brand-yellow:#f8c92b;
  --ok:#25744a; --ok-soft:#dff1e6; --warn:#94600f; --warn-soft:#faefd6; --bad:#ad3029; --bad-soft:#f8e2e0;
  --violet:#6b3fa0; --violet-soft:#eee6f7; --orange:#b4561a; --orange-soft:#fbe9dc; --blue:#2463a6; --blue-soft:#e2edf8;
  --shadow:0 1px 2px rgba(20,35,50,.06),0 4px 14px rgba(20,35,50,.06);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#10151b; --surface:#17202a; --surface-2:#1d2834; --ink:#e3e9ef; --muted:#93a2b1; --line:#2c3947;
  --accent:#ff6b70; --accent-ink:#1a0606; --accent-soft:#3d1c1d;
  --ok:#5fc78d; --ok-soft:#173326; --warn:#e3b356; --warn-soft:#3a2e15; --bad:#f07c72; --bad-soft:#3d1f1d;
  --violet:#b994e6; --violet-soft:#2b2140; --orange:#f0a066; --orange-soft:#3a2516; --blue:#7fb4ea; --blue-soft:#1b2c40;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:1.8rem}h2{font-size:1.3rem}h3{font-size:1.08rem}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-size:.88em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.84rem}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
[hidden]{display:none!important}

/* barra superior y pestañas */
.top{position:sticky;top:0;z-index:20;background:var(--brand-black);color:#fff;border-bottom:4px solid var(--brand-yellow);padding-top:env(safe-area-inset-top,0px)}
.brand-logo{height:34px;width:auto;display:block;flex:none}
.top-row>.row{flex-wrap:nowrap;flex:none}
@media (max-width:440px){.top .brand>div{display:none}.brand-logo{height:30px}}
.top .brand small{color:#b9b9b9}
.top .bell{background:#222;border-color:#3a3a3a;color:#fff}
.top .btn{background:#222;border-color:#3a3a3a;color:#fff}
.tagline{background:var(--brand-yellow);color:#111;font-weight:700;letter-spacing:.18em;font-size:.72rem;text-align:center;padding:5px 8px;text-transform:uppercase}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.2rem;flex:none}
.brand b{font-family:var(--f-display);font-size:1.15rem;display:block;line-height:1}
.brand small{color:var(--muted);font-size:.78rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:7px;cursor:pointer;color:#c9c9c9;font-weight:600;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab:hover{background:#262626;color:#fff}
.tab[aria-current="true"]{background:var(--brand-yellow);color:#111}
.tab:focus-visible{outline:2px solid var(--brand-yellow);outline-offset:1px}
.count{min-width:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:.72rem;font-weight:700;text-align:center;line-height:18px}
.bell{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:40px;height:40px;cursor:pointer;font-size:1.1rem}
.bell .count{position:absolute;top:-6px;right:-8px}
main{max-width:1180px;margin:0 auto;padding-block:18px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--muted);max-width:68ch}

/* controles */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:7px;cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.field:focus-visible,.tab:focus-visible,.chk:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.sm{padding:5px 9px;font-size:.82rem}
.btn.big{padding:13px 18px;font-size:1.02rem}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:9px 11px;min-width:0}
textarea.field{min-height:66px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.86rem;font-weight:600;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 110px;border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* superficies */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-b{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.empty{padding:18px 16px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);border-left:5px solid var(--tone,var(--line));display:flex;flex-direction:column;min-width:0}
.card-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:flex-start;padding:12px 14px 8px}
.card-h .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.card-b{padding:0 14px 12px;display:flex;flex-direction:column;gap:10px}
.card-f{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pnum{font-family:var(--f-mono);font-weight:600;font-size:1.05rem}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px 16px}
.kv>div{display:flex;flex-direction:column;gap:1px;min-width:0}
.kv b{font-weight:500;overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;border-top:4px solid var(--tone,var(--accent))}
.tile b{font-family:var(--f-display);font-size:2.1rem;line-height:1.05;font-variant-numeric:tabular-nums}
.tile span{font-size:.84rem;color:var(--muted)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.violet{background:var(--violet-soft);color:var(--violet);border-color:transparent}
.chip.orange{background:var(--orange-soft);color:var(--orange);border-color:transparent}
.chip.blue{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}

/* tablas */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
td .field{padding:6px 8px}

/* checklist bodega */
.check-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.check-row:last-child{border-bottom:0}
.chk{width:48px;height:48px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:1.5rem;cursor:pointer;display:grid;place-items:center;color:var(--ok)}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.chk.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.chk.wait{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.check-row .qty{font-family:var(--f-display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;min-width:48px}
.check-row .acts{grid-column:2/-1;display:flex;gap:6px;flex-wrap:wrap}
.desc{font-weight:600}
.done .desc{text-decoration:line-through;color:var(--muted)}
.notice{padding:10px 12px;border-radius:7px;font-size:.9rem;background:var(--warn-soft);color:var(--warn)}
.notice.bad{background:var(--bad-soft);color:var(--bad)} .notice.ok{background:var(--ok-soft);color:var(--ok)} .notice.info{background:var(--blue-soft);color:var(--blue)}
.progress{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok)}

/* autocompletar */
.ac{position:relative}
.dropdown{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:30;max-height:320px;overflow:auto}
.dropdown button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 12px;cursor:pointer}
.dropdown button:hover,.dropdown button:focus{background:var(--accent-soft);outline:none}
.dropdown button:last-child{border-bottom:0}

/* historial */
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.tl:last-child{border-bottom:0}
.tl time{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(8,16,24,.55);display:flex;justify-content:center;align-items:flex-start;padding:max(20px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 20px max(10px,env(safe-area-inset-left,0px));overflow:auto;z-index:50}
.modal{background:var(--surface);border-radius:11px;width:min(860px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column}
.modal.narrow{width:min(480px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}
.modal-b{padding:16px 18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.pdf-frame{width:100%;height:62vh;border:1px solid var(--line);border-radius:6px;background:#fff}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login form{width:min(400px,100%);display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 0 24px;box-shadow:var(--shadow);overflow:hidden}
.login form>*:not(.login-brand){margin-inline:24px}
.login-brand{background:var(--brand-black);padding:22px 20px 0;display:flex;flex-direction:column;align-items:center}
.login-brand img{width:100%;max-width:300px;height:auto;margin-bottom:18px}
.login-brand .tagline{align-self:stretch;margin:0 -20px}
.toast{position:fixed;bottom:max(18px,calc(env(safe-area-inset-bottom,0px) + 12px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:9px;font-size:.92rem;z-index:80;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast.bad{background:var(--bad);color:#fff}
.loading{padding:40px;text-align:center;color:var(--muted)}
@media (max-width:760px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cards{grid-template-columns:minmax(0,1fr)}
  .brand small{max-width:44vw}
  .tl{grid-template-columns:1fr;gap:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"><div class="loading">Cargando…</div></div>
<div id="modal-root"></div>
<div id="toast" class="toast" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
'use strict';
/* =========================================================
   CONFIGURACIÓN Y UTILIDADES
   ========================================================= */
const CFG = Object.assign({SEMAFORO_VERDE:20, SEMAFORO_AMARILLO:40, DOMINIO_USUARIOS:'ferro.app', EMPRESA:'Ferrodistribuciones', ESLOGAN:'MATERIALES PARA CONSTRUCCIÓN & FERRETERÍA', LOGO_APP:'logo-app.png', LOGO_PDF:'logo-pdf.png'}, window.FERRO_CONFIG || {});
const configurado = CFG.SUPABASE_URL && !/TU-PROYECTO/.test(CFG.SUPABASE_URL) && CFG.SUPABASE_ANON_KEY && !/PEGA_AQUI/.test(CFG.SUPABASE_ANON_KEY);
const sb = configurado ? supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY) : null;

const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COP = new Intl.NumberFormat('es-CO', {style:'currency', currency:'COP', maximumFractionDigits:0});
const money = n => COP.format(Math.round(Number(n) || 0));
const cant = n => Number(n).toLocaleString('es-CO', {maximumFractionDigits:2});
const fdt = t => t ? new Date(t).toLocaleString('es-CO', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}) : '—';
const esHoy = t => t && new Date(t).toDateString() === new Date().toDateString();
const minDesde = (a, b) => Math.max(0, Math.floor(((b ? new Date(b) : new Date()) - new Date(a)) / 60000));
const durTxt = m => m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min';
const parseNum = v => Number(String(v ?? '').replace(/\s/g, '').replace(',', '.'));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function fail(msg) { throw new Error(msg); }

const ROLES = {vendedor:'Vendedor', bodega:'Bodega', verificacion:'Verificación', despacho:'Despacho', contabilidad:'Contabilidad', gerencia:'Gerencia'};
const ESTADO = {
  COTIZACION:['🧾 Cotización',''], DESCARTADA:['🗑️ Descartada',''], CONFIRMADO:['🟣 Confirmado','violet'],
  EN_PREPARACION:['🟠 En preparación','orange'], PREPARADO:['⏳ Por verificar','warn'], VERIFICADO:['🔵 Verificado','blue'],
  PARCIAL:['🚚 Parcial','blue'], DESPACHADO:['🚚 Despachado','ok'], FACTURADO:['📄 Facturado',''], ANULADO:['🚫 Anulado','bad']
};
const PRIO = {Urgente:['🔴 Urgente','bad',0], Hoy:['🟡 Hoy','warn',1], Ruta:['🟢 Ruta','ok',2]};
const ACTIVOS = ['COTIZACION','CONFIRMADO','EN_PREPARACION','PREPARADO','VERIFICADO','PARCIAL','DESPACHADO'];
const EN_CURSO = ['CONFIRMADO','EN_PREPARACION','PREPARADO','VERIFICADO','PARCIAL'];

const st = {me:null, tab:null, pedidos:[], lineas:{}, clientes:[], productos:[], profiles:[], notifs:[], facturas:[], ui:{}, pdf:null, logo:undefined};

/* =========================================================
   DATOS
   ========================================================= */
async function fetchAll(build) {
  let out = [], from = 0;
  for (;;) {
    const {data, error} = await build().range(from, from + 999);
    if (error) throw error;
    out = out.concat(data || []);
    if (!data || data.length < 1000) break;
    from += 1000;
  }
  return out;
}
const tiene = r => !!st.me && st.me.roles.includes(r);
const ped = id => st.pedidos.find(p => p.id === Number(id));
const lins = p => st.lineas[p.id] || [];
const cliente = id => st.clientes.find(c => c.id === Number(id));
const TIERS = [['especial','Contado especial Sincelejo'], ['contado','Contado ferretería'], ['credito','Crédito ferretería'], ['mostrador1','Precio 1 mostrador'], ['mostrador2','Precio 2 mostrador']];
const tierNombre = t => (TIERS.find(x => x[0] === t) || [t, t])[1];
const precioTier = (prod, t) => { if (!prod) return null; let v = prod['p_' + t]; if (t === 'especial' && v == null) v = prod.p_contado; return v == null || v === '' ? null : Number(v); };
function reprecio(tier) {
  st.draft.lineas.forEach(l => {
    const pr = st.productos.find(x => x.codigo === l.codigo && x.descripcion === l.descripcion); if (!pr) return;
    const nuevo = precioTier(pr, tier);
    const enLista = l.precio_lista == null ? (l.precio === '' || l.precio == null) : parseNum(l.precio) === Number(l.precio_lista);
    if (enLista) l.precio = nuevo ?? '';
    l.precio_lista = nuevo;
  });
}
const precioCambiado = l => l.precio_lista != null && Number(l.precio) !== Number(l.precio_lista);
const totalPed = p => lins(p).filter(l => !l.agotado).reduce((a, l) => a + Number(l.cantidad) * Number(l.precio), 0);

async function cargar() {
  const desde = new Date(Date.now() - 90 * 864e5).toISOString();
  const [peds, profs, notifs, facts] = await Promise.all([
    fetchAll(() => sb.from('pedidos').select('*').or(`estado.in.(${ACTIVOS.join(',')}),created_at.gte.${desde}`).order('id', {ascending:false})),
    sb.from('profiles').select('*').order('nombre'),
    sb.from('notificaciones').select('*').order('at', {ascending:false}).limit(100),
    sb.from('facturas').select('id,numero,pedido_id,total,created_at,created_nombre').order('id', {ascending:false}).limit(1000)
  ]);
  st.pedidos = peds;
  st.profiles = profs.data || [];
  st.notifs = notifs.data || [];
  st.facturas = facts.data || [];
  const ids = peds.map(p => p.id), map = {};
  for (let i = 0; i < ids.length; i += 150) {
    const chunk = ids.slice(i, i + 150);
    const ls = await fetchAll(() => sb.from('lineas').select('*').in('pedido_id', chunk).order('orden').order('id'));
    ls.forEach(l => (map[l.pedido_id] = map[l.pedido_id] || []).push(l));
  }
  st.lineas = map;
  const yo = st.profiles.find(u => u.id === st.me.id);
  if (yo) { st.me = yo; if (!yo.activo || !yo.roles.length) { await salir('Tu acceso fue desactivado. Habla con Gerencia.'); } }
}
async function cargarCatalogos() {
  const [cl, pr] = await Promise.all([
    fetchAll(() => sb.from('clientes').select('*').order('nombre')),
    fetchAll(() => sb.from('productos').select('*').eq('activo', true).order('codigo'))
  ]);
  st.clientes = cl; st.productos = pr;
  if (tiene('gerencia')) { const im = await sb.from('importaciones').select('*').order('id', {ascending:false}).limit(30); st.imports = im.error ? [] : (im.data || []); }
}

let recargaT;
function recargarPronto() {
  clearTimeout(recargaT);
  recargaT = setTimeout(async () => { try { await cargar(); render(); } catch (e) { console.error(e); } }, 350);
}
function suscribir() {
  if (st.chan) sb.removeChannel(st.chan);
  st.chan = sb.channel('ferro-' + st.me.id)
    .on('postgres_changes', {event:'*', schema:'public', table:'pedidos'}, recargarPronto)
    .on('postgres_changes', {event:'*', schema:'public', table:'lineas'}, recargarPronto)
    .on('postgres_changes', {event:'*', schema:'public', table:'facturas'}, recargarPronto)
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'notificaciones', filter:'user_id=eq.' + st.me.id}, p => {
      toast('🔔 ' + p.new.texto); try { navigator.vibrate && navigator.vibrate(180); } catch (e) {}
      recargarPronto();
    })
    .subscribe();
}
setInterval(() => { if (st.me && document.visibilityState === 'visible') recargarPronto(); }, 45000);
document.addEventListener('visibilitychange', () => { if (st.me && document.visibilityState === 'visible') recargarPronto(); });

async function upd(tabla, id, valores) {
  const {data, error} = await sb.from(tabla).update(valores).eq('id', id).select('id');
  if (error) fail(error.message);
  if (!data || !data.length) fail('No se pudo guardar. Revisa que tu usuario tenga permiso para esta acción.');
}
async function rpc(nombre, args) {
  const {data, error} = await sb.rpc(nombre, args);
  if (error) fail(error.message);
  return data;
}

/* =========================================================
   SESIÓN
   ========================================================= */
const emailDe = u => { const t = String(u).trim().toLowerCase(); return t.includes('@') ? t : `${t}@${CFG.DOMINIO_USUARIOS}`; };
function errAuth(m) {
  if (/invalid login/i.test(m)) return 'Usuario o contraseña incorrectos.';
  if (/not confirmed/i.test(m)) return 'El acceso no está confirmado. En Supabase desactiva "Confirm email" (ver guía).';
  if (/already registered|already exists/i.test(m)) return 'Ese nombre de usuario ya existe.';
  if (/password/i.test(m) && /6/.test(m)) return 'La contraseña debe tener al menos 6 caracteres.';
  return m;
}
async function entrar(usuario, clave) {
  const {data, error} = await sb.auth.signInWithPassword({email: emailDe(usuario), password: clave});
  if (error) fail(errAuth(error.message));
  await iniciar(data.user);
}
async function iniciar(user) {
  const {data: perfil, error} = await sb.from('profiles').select('*').eq('id', user.id).single();
  if (error || !perfil) { await sb.auth.signOut(); fail('No se encontró tu perfil. Pide a Gerencia que revise tu usuario.'); }
  if (!perfil.activo || !perfil.roles.length) { await sb.auth.signOut(); fail('Tu usuario no tiene funciones asignadas. Pide a Gerencia que te las asigne.'); }
  st.me = perfil;
  $('#app').innerHTML = '<div class="loading">Cargando pedidos…</div>';
  await Promise.all([cargar(), cargarCatalogos()]);
  const tabs = misTabs();
  let guardada = null; try { guardada = localStorage.getItem('ferro_tab_' + perfil.id); } catch (e) {}
  st.tab = tabs.some(t => t.id === guardada) ? guardada : tabs[0].id;
  st.draft = cargarDraft();
  suscribir();
  render(true);
}
async function salir(msg) {
  if (st.chan) sb.removeChannel(st.chan);
  await sb.auth.signOut();
  Object.assign(st, {me:null, pedidos:[], lineas:{}, notifs:[], ui:{}, draft:null});
  render(true);
  if (msg) toast(msg, 'bad');
}

/* =========================================================
   PIEZAS DE INTERFAZ
   ========================================================= */
function chipEstado(p) {
  const [t, tone] = ESTADO[p.estado] || [p.estado, ''];
  if (p.estado === 'PARCIAL') { const ls = lins(p).filter(l => !l.agotado); return `<span class="chip ${tone}">🚚 Parcial ${ls.filter(l => l.entrega_id).length}/${ls.length}</span>`; }
  return `<span class="chip ${tone}">${t}</span>`;
}
const chipPrio = p => { if (!p.prioridad) return ''; const [t, tone] = PRIO[p.prioridad] || [p.prioridad, '']; return `<span class="chip ${tone}">${t}</span>`; };
const horaCorta = t => { const d = new Date(t); const h = d.toLocaleTimeString('es-CO', {hour:'numeric', minute:'2-digit'}); return esHoy(t) ? h : d.toLocaleDateString('es-CO', {day:'2-digit', month:'2-digit'}) + ' ' + h; };
function chipHora(p) {
  if (!p.hora_entrega) return '';
  const tarde = !p.despachado_at && !['ANULADO','FACTURADO'].includes(p.estado) && new Date(p.hora_entrega) < new Date();
  return `<span class="chip ${tarde ? 'bad' : p.prioridad === 'Urgente' ? 'orange' : ''}" title="Hora de entrega">⏰ ${horaCorta(p.hora_entrega)}${tarde ? ' · vencida' : ''}</span>`;
}
const chipEntrega = p => !p.tipo_entrega ? '' : p.tipo_entrega === 'Domicilio' ? '<span class="chip blue">🚚 Domicilio</span>' : '<span class="chip violet">🏪 Recoge en bodega</span>';
const rankPrio = p => PRIO[p.prioridad] ? PRIO[p.prioridad][2] : 9;
// Urgentes primero y por la hora de entrega más cercana; luego por hora de llegada
const ordenCola = (a, b) => rankPrio(a) - rankPrio(b)
  || (a.hora_entrega ? new Date(a.hora_entrega) : Infinity) - (b.hora_entrega ? new Date(b.hora_entrega) : Infinity)
  || new Date(a.confirmado_at) - new Date(b.confirmado_at);
const ueDe = l => Math.max(1, Number(l.ue) || 1);
const empTxt = l => ueDe(l) > 1 ? `${cant(Number(l.cantidad) / ueDe(l))} emp. × ${cant(ueDe(l))}` : '';
const cantHtml = l => `${cant(l.cantidad)}${ueDe(l) > 1 ? `<div class="small muted" style="font-weight:500;font-size:.75rem">${empTxt(l)}</div>` : ''}`;
function semaforo(p) {
  if (!p.confirmado_at || ['ANULADO','DESCARTADA','COTIZACION'].includes(p.estado)) return null;
  const m = minDesde(p.confirmado_at, p.despachado_at);
  const tone = m < CFG.SEMAFORO_VERDE ? 'ok' : m <= CFG.SEMAFORO_AMARILLO ? 'warn' : 'bad';
  return {m, tone, vivo: !p.despachado_at};
}
function chipSem(p) {
  const s = semaforo(p); if (!s) return '';
  const ic = s.tone === 'ok' ? '🟢' : s.tone === 'warn' ? '🟡' : '🔴';
  return `<span class="chip ${s.tone}" title="Desde la confirmación hasta el despacho completo">${ic} ${durTxt(s.m)}${s.vivo ? '' : ' ✓'}</span>`;
}
const tonoSem = p => { const s = semaforo(p); return s ? `var(--${s.tone})` : 'var(--line)'; };
function responsable(p) {
  switch (p.estado) {
    case 'CONFIRMADO': return 'Bodega (en cola)';
    case 'EN_PREPARACION': return p.tomado_nombre || 'Bodega';
    case 'PREPARADO': return 'Verificación';
    case 'VERIFICADO': return 'Despacho';
    case 'PARCIAL': return 'Despacho';
    case 'DESPACHADO': return 'Contabilidad';
    case 'COTIZACION': return p.vendedor_nombre;
    default: return '—';
  }
}
function incidencias(p) {
  return lins(p).filter(l => l.agotado || l.pendiente || l.cantidad_original != null);
}
function chipsLinea(l) {
  const c = [];
  if (l.entrega_id) c.push(`<span class="chip ok">${l.despacho_medio === 'Ruta' ? '🚚 Salió por ruta' : '🏪 Recogido en bodega'}</span>`);
  if (l.agotado) c.push('<span class="chip bad">❌ Agotado</span>');
  if (l.pendiente) c.push('<span class="chip warn">🕒 Pendiente por empacar</span>');
  if (l.cantidad_original != null) c.push(`<span class="chip warn">✏️ Cantidad ${cant(l.cantidad_original)} → ${cant(l.cantidad)}</span>`);
  if (l.encargado) c.push(`<span class="chip">👤 ${esc(l.encargado)}</span>`);
  return c.join(' ');
}
function pedidoCard(p, acciones, extra = '') {
  const ls = lins(p);
  return `<article class="card" style="--tone:${tonoSem(p)}">
    <div class="card-h"><div class="t"><span class="pnum">${esc(p.numero || p.cot_numero)}</span><span class="small muted">${esc(p.cliente_nombre)}</span></div>
      <div class="row">${chipEstado(p)}${p.estado !== 'COTIZACION' ? chipPrio(p) + chipHora(p) + chipEntrega(p) : ''}${chipSem(p)}</div></div>
    <div class="card-b"><div class="kv small">
      <div><span class="lbl">Creado</span><b>${fdt(p.created_at)}</b></div>
      <div><span class="lbl">Responsable</span><b>${esc(responsable(p))}</b></div>
      <div><span class="lbl">Productos</span><b>${ls.length}</b></div>
      <div><span class="lbl">Total</span><b>${money(totalPed(p))}</b></div>
    </div>${extra}</div>
    <div class="card-f">${acciones}</div></article>`;
}

  if (!force && a && a.closest && a.closest('main') && ['INPUT','TEXTAREA','SELECT'].includes(a.tagName)) { st.pendiente = true; return; }
  st.pendiente = false;

  </header><main>${VIEW[st.tab]()}</main>`;

}

/* ---------- VENDEDOR: COTIZACIONES ---------- */
VIEW.cot = () => {
  const q = norm(st.ui.cotQ || '');
  const mias = p => p.vendedor_id === st.me.id && (!q || norm(p.cot_numero + ' ' + (p.numero || '') + ' ' + p.cliente_nombre).includes(q));
  const abiertas = st.pedidos.filter(p => p.estado === 'COTIZACION' && mias(p));
  const cerradas = st.pedidos.filter(p => p.cot_numero && p.estado !== 'COTIZACION' && mias(p));
  return `<div class="head"><div><h1>Mis cotizaciones</h1><p>Aquí están todas las cotizaciones que has hecho. Descarga el PDF para el cliente, edítala si cambia algo y, cuando confirme, envíala a bodega.</p></div>
    <input class="field" id="cot-q" data-ui="cotQ" placeholder="Buscar cotización o cliente" value="${esc(st.ui.cotQ || '')}" style="width:240px"></div>
  <h2>Abiertas · ${abiertas.length}</h2>
  ${abiertas.length ? `<div class="cards">${abiertas.map(p => pedidoCard(p, `
      <button class="btn sm" data-act="pdfCot" data-id="${p.id}">📄 PDF</button>
      <button class="btn sm" data-act="editarCot" data-id="${p.id}">✏️ Editar</button>
      <button class="btn sm primary" data-act="enviarBodega" data-id="${p.id}">📦 Enviar a bodega</button>
      <button class="btn sm danger" data-act="descartarCot" data-id="${p.id}">🗑️ Descartar</button>`)).join('')}</div>` : vacio('No tienes cotizaciones abiertas. Créalas en "Nueva cotización".')}
  ${cerradas.length ? `<section class="panel"><div class="panel-h"><h2>Historial · ${cerradas.length}</h2><span class="small muted">Últimos 90 días</span></div><div class="tbl"><table><thead><tr><th>Cotización</th><th>Cliente</th><th>Resultado</th><th>Fecha</th><th class="num">Total</th><th></th></tr></thead><tbody>
    ${cerradas.map(p => `<tr><td class="mono">${esc(p.cot_numero)}</td><td>${esc(p.cliente_nombre)}</td><td>${p.estado === 'DESCARTADA' ? '🗑️ Descartada' : '📦 Pedido <span class="mono">' + esc(p.numero) + '</span> ' + chipEstado(p)}</td><td class="mono small">${fdt(p.confirmado_at || p.created_at)}</td><td class="num">${money(totalPed(p))}</td><td><div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-act="pdfCot" data-id="${p.id}">📄 PDF</button><button class="btn sm" data-act="detalle" data-id="${p.id}">📜</button></div></td></tr>`).join('')}
  </tbody></table></div></section>` : ''}`;
};

/* ---------- VENDEDOR: CLIENTES ---------- */
VIEW.clientes = () => {
  const q = norm(st.ui.cliQ || '');
  const list = st.clientes.filter(c => !q || norm(c.nombre + ' ' + c.nit + ' ' + c.contacto + ' ' + c.municipio).includes(q)).slice(0, 200);
  return `<div class="head"><div><h1>Clientes</h1><p>${st.clientes.length} clientes registrados. Al crear un pedido, el buscador trae estos datos y completa la dirección.</p></div>
    <div class="row"><input class="field" id="cli-buscar" data-ui="cliQ" placeholder="Buscar cliente, NIT o municipio" value="${esc(st.ui.cliQ || '')}" style="width:240px"><button class="btn primary" data-act="clienteForm">➕ Nuevo cliente</button></div></div>
  ${list.length ? `<div class="cards">${list.map(c => `<article class="card"><div class="card-h"><div class="t"><b>${esc(c.nombre)}</b><span class="small muted">NIT ${esc(c.nit || '—')}</span></div></div>
    <div class="card-b"><div class="kv small">
      <div><span class="lbl">Contacto</span><b>${esc(c.contacto || '—')}</b></div><div><span class="lbl">Teléfono</span><b>${esc(c.telefono || '—')}</b></div>
      <div><span class="lbl">Correo</span><b>${esc(c.correo || '—')}</b></div><div><span class="lbl">Dirección</span><b>${esc(c.direccion || '—')}${c.municipio ? ', ' + esc(c.municipio) : ''}</b></div>
    </div>${c.ubicacion ? `<a class="small" href="${esc(c.ubicacion)}" target="_blank" rel="noopener">📍 Ver ubicación en el mapa</a>` : ''}</div>
    <div class="card-f"><button class="btn sm primary" data-act="usarCliente" data-id="${c.id}">Usar en pedido</button><button class="btn sm" data-act="clienteForm" data-id="${c.id}">✏️ Editar</button><button class="btn sm danger" data-act="borrarCliente" data-id="${c.id}">🗑️ Eliminar</button></div></article>`).join('')}</div>` : vacio('No hay clientes con esa búsqueda.')}`;
};

/* ---------- BODEGA ---------- */
VIEW.bodega = () => {
  const ord = ordenCola;
  const cola = st.pedidos.filter(p => p.estado === 'CONFIRMADO').sort(ord);
  const prep = st.pedidos.filter(p => p.estado === 'EN_PREPARACION').sort((a, b) => (b.tomado_por === st.me.id) - (a.tomado_por === st.me.id) || ord(a, b));
  const pend = st.pedidos.filter(p => ['PREPARADO','VERIFICADO','PARCIAL'].includes(p.estado)).flatMap(p => lins(p).filter(l => l.pendiente && !l.entrega_id).map(l => ({p, l})));
  return `<div class="head"><div><h1>Bodega</h1><p>Los pedidos aparecen por prioridad: primero 🔴 Urgente ordenados por la hora de entrega más cercana, luego 🟡 Hoy y 🟢 Ruta por hora de llegada.</p></div></div>
  <section><h2 style="margin-bottom:8px">Cola de pedidos</h2>
  ${cola.length ? `<div class="cards">${cola.map(p => `<article class="card" style="--tone:${tonoSem(p)}"><div class="card-h"><div class="t"><span class="pnum">${esc(p.numero)}</span><b>${esc(p.cliente_nombre)}</b></div><div class="row">${chipPrio(p)}${chipEntrega(p)}${chipSem(p)}</div></div>
      <div class="card-b">${p.hora_entrega ? `<div class="notice ${p.prioridad === 'Urgente' ? 'bad' : 'info'}"><b>⏰ Entregar ${esHoy(p.hora_entrega) ? 'hoy a las' : 'el'} ${horaCorta(p.hora_entrega)}</b></div>` : ''}<div class="kv small"><div><span class="lbl">Productos</span><b>${lins(p).length}</b></div><div><span class="lbl">Esperando</span><b>${durTxt(minDesde(p.confirmado_at))}</b></div><div><span class="lbl">Creado</span><b>${fdt(p.created_at)}</b></div><div><span class="lbl">Vendedor</span><b>${esc(p.vendedor_nombre)}</b></div></div>
      ${p.observaciones ? `<div class="small muted">📝 ${esc(p.observaciones)}</div>` : ''}</div>
      <div class="card-f"><button class="btn primary big block" data-act="tomar" data-id="${p.id}">TOMAR PEDIDO</button></div></article>`).join('')}</div>` : vacio('No hay pedidos en cola.')}
  </section>
  <section style="display:flex;flex-direction:column;gap:12px"><h2>En preparación</h2>
  ${prep.length ? prep.map(p => checklist(p)).join('') : vacio('Nadie está preparando pedidos ahora.')}</section>
  <section class="panel"><div class="panel-h"><h2>🕒 Pedidos con productos pendientes por empacar</h2><span class="muted small">${pend.length} producto${pend.length === 1 ? '' : 's'}</span></div>
  ${pend.length ? `<div class="panel-b">${pend.map(({p, l}) => `<div class="check-row">
      <button class="chk" data-act="empacar" data-id="${l.id}" aria-label="Marcar ${esc(l.descripcion)} como empacado">✔</button>
      <div style="min-width:0"><div class="desc">${esc(l.descripcion)}</div><div class="small muted"><span class="mono">${esc(p.numero)}</span> · ${esc(p.cliente_nombre)} · ${ESTADO[p.estado][0]}</div></div>
      <div class="qty">${cant(l.cantidad)}</div>
      <div class="acts"><button class="btn sm" data-act="pendiente" data-id="${l.id}">🕒 Quitar pendiente</button>${l.encargado ? `<span class="chip">👤 ${esc(l.encargado)}</span>` : ''}</div></div>`).join('')}</div>` : '<div class="empty">No hay productos pendientes en pedidos ya preparados.</div>'}</section>`;
};
function checklist(p) {
  const ls = lins(p);
  const marcados = ls.filter(l => l.empacado || l.agotado || l.pendiente).length;
  const listo = marcados === ls.length && ls.some(l => !l.agotado);
  return `<article class="card" style="--tone:${tonoSem(p)}">
    <div class="card-h"><div class="t"><span class="pnum">${esc(p.numero)}</span><b>${esc(p.cliente_nombre)}</b><span class="small muted">Responsable: ${esc(p.tomado_nombre)} · inició ${fdt(p.tomado_at)}</span></div><div class="row">${chipPrio(p)}${chipHora(p)}${chipEntrega(p)}${chipSem(p)}<button class="btn sm" data-act="detalle" data-id="${p.id}">📜</button></div></div>
    <div class="card-b">
      ${p.nota_devolucion ? `<div class="notice bad">↩️ Devuelto por verificación: ${esc(p.nota_devolucion)}</div>` : ''}
      ${p.observaciones ? `<div class="small muted">📝 ${esc(p.observaciones)}</div>` : ''}
      <div class="spread small"><span>${marcados} de ${ls.length} productos marcados</span></div>
      <div class="progress"><i style="width:${ls.length ? marcados / ls.length * 100 : 0}%"></i></div>
      <div>${ls.map(l => `<div class="check-row ${l.empacado ? 'done' : ''}">
        <button class="chk ${l.empacado ? 'on' : l.agotado ? 'bad' : l.pendiente ? 'wait' : ''}" data-act="empacar" data-id="${l.id}" aria-pressed="${l.empacado}" aria-label="${l.empacado ? 'Desmarcar' : 'Marcar empacado'}: ${esc(l.descripcion)}">${l.empacado ? '✔' : l.agotado ? '❌' : l.pendiente ? '🕒' : ''}</button>
        <div style="min-width:0"><div class="desc">${esc(l.descripcion)}</div><div class="small muted"><span class="mono">${esc(l.codigo || '')}</span>${ueDe(l) > 1 ? ' · <b>' + empTxt(l) + '</b>' : ''}</div></div>
        <div class="qty">${cant(l.cantidad)}</div>
        <div class="acts">${chipsLinea(l)}
          <button class="btn sm" data-act="agotado" data-id="${l.id}">${l.agotado ? '↺ Quitar agotado' : '❌ Agotado'}</button>
          <button class="btn sm" data-act="cantidad" data-id="${l.id}">✏️ Cantidad</button>
          <button class="btn sm" data-act="pendiente" data-id="${l.id}">${l.pendiente ? '↺ Quitar pendiente' : '🕒 Pendiente'}</button>
          <button class="btn sm" data-act="mover" data-id="${l.id}">↪️ Mover</button>
          <button class="btn sm" data-act="encargado" data-id="${l.id}">👤 Encargado</button>
        </div></div>`).join('')}</div>
    </div>
    <div class="card-f"><button class="btn ok big block" data-act="terminar" data-id="${p.id}" ${listo ? '' : 'disabled'}>✅ Terminar preparación</button></div></article>`;
}

/* ---------- VERIFICACIÓN ---------- */
VIEW.verif = () => {
  const list = st.pedidos.filter(p => p.estado === 'PREPARADO').sort((a, b) => new Date(a.preparado_at) - new Date(b.preparado_at));
  return `<div class="head"><div><h1>Verificación</h1><p>Revisa productos y cantidades contra lo empacado. Si todo está bien, presiona Verificado.</p></div></div>
  ${list.length ? `<div class="cards">${list.map(p => `<article class="card" style="--tone:${tonoSem(p)}"><div class="card-h"><div class="t"><span class="pnum">${esc(p.numero)}</span><b>${esc(p.cliente_nombre)}</b><span class="small muted">Preparó ${esc(p.tomado_nombre)} · terminó ${fdt(p.preparado_at)}</span></div><div class="row">${chipPrio(p)}${chipHora(p)}${chipEntrega(p)}${chipSem(p)}</div></div>
    <div class="card-b"><div class="tbl"><table><thead><tr><th>Producto</th><th class="num">Cant.</th><th>Estado</th></tr></thead><tbody>
      ${lins(p).map(l => `<tr><td>${esc(l.descripcion)}<div class="small muted mono">${esc(l.codigo || '')}</div></td><td class="num"><b>${cantHtml(l)}</b></td><td>${l.empacado ? '<span class="chip ok">✔ Empacado</span>' : ''} ${chipsLinea(l)}</td></tr>`).join('')}
    </tbody></table></div></div>
    <div class="card-f"><button class="btn ok big" data-act="verificar" data-id="${p.id}" style="flex:1">✔ Verificado</button><button class="btn danger" data-act="devolver" data-id="${p.id}">↩️ Devolver a bodega</button><button class="btn" data-act="pdfPedido" data-id="${p.id}">⬇️ PDF</button></div></article>`).join('')}</div>` : vacio('No hay pedidos por verificar.')}`;
};

/* ---------- DESPACHO ---------- */
VIEW.despacho = () => {
  const list = st.pedidos.filter(p => ['VERIFICADO','PARCIAL'].includes(p.estado)).sort(ordenCola);
  const hoyDesp = st.pedidos.filter(p => esHoy(p.despachado_at)).length;
  let ultimo = ''; try { ultimo = localStorage.getItem('ferro_conductor') || ''; } catch (e) {}
  return `<div class="head"><div><h1>Despacho</h1><p>Despacha producto por producto: 🚚 por ruta o 🏪 si el cliente recoge en bodega. El pedido pasa a Despachado cuando sale el último producto. Hoy: ${hoyDesp} despachados.</p></div></div>
  ${list.length ? `<div class="cards">${list.map(p => {
    const ls = lins(p); const listos = ls.filter(l => !l.entrega_id && !l.agotado && !l.pendiente && l.empacado);
    const bloqueados = ls.filter(l => !l.entrega_id && !l.agotado && (l.pendiente || !l.empacado));
    const cond = st.ui['dc-' + p.id] ?? ultimo, veh = st.ui['dv-' + p.id] ?? '';
    return `<article class="card" style="--tone:${tonoSem(p)}"><div class="card-h"><div class="t"><span class="pnum">${esc(p.numero)}</span><b>${esc(p.cliente_nombre)}</b><span class="small muted">${esc(p.direccion || '')}${p.municipio ? ', ' + esc(p.municipio) : ''}</span></div><div class="row">${chipEstado(p)}${chipPrio(p)}${chipHora(p)}${chipEntrega(p)}${chipSem(p)}</div></div>
    <div class="card-b">
      ${bloqueados.length ? `<div class="notice bad">⚠️ ${bloqueados.length} producto(s) pendiente(s) por empacar. No pueden salir hasta que bodega los marque como empacados.</div>` : ''}
      <div class="form-grid"><label class="f">Conductor<input class="field" id="dc-${p.id}" data-ui="dc-${p.id}" value="${esc(cond)}" placeholder="Nombre del conductor"></label><label class="f">Vehículo (placa)<input class="field" id="dv-${p.id}" data-ui="dv-${p.id}" value="${esc(veh)}" placeholder="ABC123" style="text-transform:uppercase"></label></div>
      <div>${ls.map(l => `<div class="check-row" style="grid-template-columns:minmax(0,1fr) auto">
        <div style="min-width:0"><div class="desc">${esc(l.descripcion)}</div><div class="small muted"><span class="mono">${esc(l.codigo || '')}</span> · ${cant(l.cantidad)} und${ueDe(l) > 1 ? ' (' + empTxt(l) + ')' : ''}</div></div>
        <div class="row">${l.entrega_id || l.agotado ? chipsLinea(l) : (l.pendiente || !l.empacado) ? '<span class="chip warn">⚠️ Pendiente por empacar</span>' :
          `<button class="btn sm primary" data-act="despLinea" data-id="${p.id}" data-l="${l.id}" data-m="Ruta">🚚 Ruta</button><button class="btn sm" data-act="despLinea" data-id="${p.id}" data-l="${l.id}" data-m="Recoge en bodega">🏪 Recoge</button>`}</div></div>`).join('')}</div>
    </div>
    <div class="card-f"><button class="btn primary" data-act="despTodo" data-id="${p.id}" ${listos.length ? '' : 'disabled'} style="flex:1">${p.tipo_entrega === 'Recoge en bodega' ? '🏪 Entregar todo al cliente en bodega' : '🚚 Despachar todo lo restante por ruta'} (${listos.length})</button>
      <button class="btn" data-act="pdfPedido" data-id="${p.id}">⬇️ Orden PDF</button>${ls.some(l => l.entrega_id) ? `<button class="btn" data-act="entregas" data-id="${p.id}">📦 Entregas</button>` : ''}</div></article>`; }).join('')}</div>` : vacio('No hay pedidos verificados esperando salida.')}`;
};

/* ---------- CONTABILIDAD ---------- */
VIEW.conta = () => {
  const list = st.pedidos.filter(p => p.estado === 'DESPACHADO');
  const q = norm(st.ui.facQ || '');
  const facts = st.facturas.filter(f => { const p = ped(f.pedido_id); return !q || norm(f.numero + ' ' + (p ? p.numero + ' ' + p.cliente_nombre : '')).includes(q); });
  return `<div class="head"><div><h1>Contabilidad</h1><p>Aquí solo aparecen pedidos despachados por completo. Cada factura guarda una copia fija de cliente, productos, precios y total.</p></div></div>
  <section class="panel"><div class="panel-h"><h2>Pedidos despachados por facturar</h2><span class="muted small">${list.length}</span></div>
  ${list.length ? `<div class="tbl"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Despachado</th><th>Pago</th><th class="num">Total</th><th></th></tr></thead><tbody>
    ${list.map(p => `<tr><td class="mono">${esc(p.numero)}</td><td>${esc(p.cliente_nombre)}</td><td class="mono">${fdt(p.despachado_at)}</td><td>${esc(p.forma_pago || '')}</td><td class="num"><b>${money(totalPed(p))}</b></td>
      <td><div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-act="pdfPedido" data-id="${p.id}">⬇️ Orden</button><button class="btn sm" data-act="entregas" data-id="${p.id}">📦 Entregas</button><button class="btn sm primary" data-act="facturar" data-id="${p.id}">📄 Generar factura</button></div></td></tr>`).join('')}
  </tbody></table></div>` : '<div class="empty">No hay pedidos pendientes de factura.</div>'}</section>
  <section class="panel"><div class="panel-h"><h2>Facturas generadas</h2><input class="field" id="fac-q" data-ui="facQ" placeholder="Buscar factura, pedido o cliente" value="${esc(st.ui.facQ || '')}" style="max-width:280px"></div>
  ${facts.length ? `<div class="tbl"><table><thead><tr><th>Factura</th><th>Pedido</th><th>Cliente</th><th class="num">Total</th><th>Fecha</th><th>Generó</th><th></th></tr></thead><tbody>
    ${facts.map(f => { const p = ped(f.pedido_id); return `<tr><td class="mono"><b>${esc(f.numero)}</b></td><td class="mono">${esc(p ? p.numero : '')}</td><td>${esc(p ? p.cliente_nombre : '')}</td><td class="num">${money(f.total)}</td><td class="mono">${fdt(f.created_at)}</td><td>${esc(f.created_nombre || '')}</td><td><button class="btn sm" data-act="pdfFactura" data-id="${f.id}">📄 Ver / PDF</button></td></tr>`; }).join('')}
  </tbody></table></div>` : '<div class="empty">Aún no hay facturas.</div>'}</section>`;
};

/* ---------- GERENCIA ---------- */
VIEW.gerencia = () => {
  const P = st.pedidos;
  const n = f => P.filter(f).length;
  const despHoy = P.filter(p => esHoy(p.despachado_at));
  const prom = despHoy.length ? Math.round(despHoy.reduce((a, p) => a + minDesde(p.confirmado_at, p.despachado_at), 0) / despHoy.length) : null;
  const activos = P.filter(p => EN_CURSO.includes(p.estado)).sort(ordenCola);
  const errores = activos.filter(p => incidencias(p).length);
  const retrasados = activos.filter(p => { const s = semaforo(p); return s && s.tone !== 'ok'; });
  const f = st.ui.gerF || 'activos', q = norm(st.ui.gerQ || '');
  let lista = f === 'activos' ? activos : f === 'retrasados' ? retrasados : f === 'errores' ? errores : f === 'precios' ? P.filter(p => p.numero && lins(p).some(precioCambiado)) : P.filter(p => p.numero && (f === 'todos' || p.estado === f));
  if (q) lista = lista.filter(p => norm(p.numero + ' ' + p.cliente_nombre + ' ' + p.vendedor_nombre).includes(q));
  const tile = (t, v, tone, sub) => `<div class="tile" style="--tone:var(--${tone})"><span>${t}</span><b>${v}</b><span>${sub}</span></div>`;
  return `<div class="head"><div><h1>Pedidos hoy</h1><p>El reloj del semáforo corre desde que se confirma el pedido hasta que sale completo: 🟢 menos de ${CFG.SEMAFORO_VERDE} min, 🟡 ${CFG.SEMAFORO_VERDE}–${CFG.SEMAFORO_AMARILLO} min, 🔴 más de ${CFG.SEMAFORO_AMARILLO} min.</p></div><button class="btn" data-act="recargar">↻ Actualizar</button></div>
  <div class="tiles">
    ${tile('Pendientes', n(p => p.estado === 'CONFIRMADO'), 'violet', 'en cola de bodega')}
    ${tile('En preparación', n(p => p.estado === 'EN_PREPARACION'), 'orange', n(p => p.estado === 'PREPARADO') + ' por verificar')}
    ${tile('Verificados hoy', n(p => esHoy(p.verificado_at)), 'blue', n(p => ['VERIFICADO','PARCIAL'].includes(p.estado)) + ' esperando despacho')}
    ${tile('Despachados hoy', despHoy.length, 'ok', n(p => p.estado === 'DESPACHADO') + ' por facturar')}
    ${tile('Errores', errores.length, 'bad', 'agotados, cambios o pendientes')}
    ${tile('Retrasados', retrasados.length, 'warn', 'en 🟡 o 🔴 ahora')}
    ${tile('Anulados hoy', n(p => esHoy(p.anulado_at)), 'bad', '🚫 con motivo registrado')}
    ${tile('Tiempo promedio', prom == null ? '—' : prom + ' min', 'accent', 'de confirmación a despacho, hoy')}
  </div>
  <section class="panel"><div class="panel-h"><h2>Pedidos</h2><div class="row">
    <input class="field" id="ger-q" data-ui="gerQ" placeholder="Buscar pedido, cliente o vendedor" value="${esc(st.ui.gerQ || '')}" style="width:240px">
    <select class="field" id="ger-f" data-ui="gerF" style="width:auto">
      ${[['activos','En curso'],['retrasados','Retrasados'],['errores','Con errores'],['precios','💲 Con precio cambiado'],['todos','Todos (90 días)'],...Object.keys(ESTADO).filter(k => !['COTIZACION','DESCARTADA'].includes(k)).map(k => [k, ESTADO[k][0]])].map(([v, t]) => `<option value="${v}" ${f === v ? 'selected' : ''}>${t}</option>`).join('')}
    </select></div></div>
  ${lista.length ? `<div class="tbl"><table><thead><tr><th>Pedido</th><th>Estado</th><th>Responsable</th><th>Cliente</th><th>Creado</th><th>Semáforo</th><th>Vendedor</th><th class="num">Total</th></tr></thead><tbody>

document.addEventListener('submit', e => {
  if (e.target.id === 'pedir-form') {
    e.preventDefault();
    const fd = new FormData(e.target), out = {};
    for (const [k, v] of fd.entries()) { if (out[k] !== undefined) out[k] = [].concat(out[k], v); else out[k] = v; }
    e.target.querySelectorAll('input[type=checkbox]').forEach(c => { if (!out[c.name]) out[c.name] = []; else if (!Array.isArray(out[c.name])) out[c.name] = [out[c.name]]; });
    cerrarModal(out);
  }
  if (e.target.id === 'login-form') {
    e.preventDefault();
    const b = e.target.querySelector('button[type=submit]'); b.disabled = true; b.textContent = 'Entrando…';

async function logoData() {

const NEGRO = [17, 17, 17], ROJO = [229, 51, 58], AMARILLO = [248, 201, 43];
async function docBase(titulo, numero, fecha) {
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'letter', compress:true});
  const W = doc.internal.pageSize.getWidth();
  // Banda negra con logo blanco
  doc.setFillColor(...NEGRO); doc.rect(0, 0, W, 38, 'F');
  const logo = await logoData();
  let logoOk = false;
  if (logo) { try { const pr = doc.getImageProperties(logo); const h = 30, w = pr.width * h / pr.height; doc.addImage(logo, 'PNG', 14, 4, w, h, 'logo', 'FAST'); logoOk = true; } catch (e) {} }
  if (!logoOk) { doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.setTextColor(255); doc.text(pdfTxt(CFG.EMPRESA.toUpperCase()), 14, 22); }
  // Tipo de documento, número y fecha
  doc.setFillColor(...ROJO); doc.rect(W - 14 - 1.4, 8, 1.4, 22, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(...AMARILLO);
  doc.text(pdfTxt(titulo), W - 19, 13.5, {align:'right'});
  doc.setFontSize(18); doc.setTextColor(255); doc.text(pdfTxt(numero), W - 19, 22.5, {align:'right'});
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(190); doc.text(pdfTxt(fecha), W - 19, 28.5, {align:'right'});
  // Franja amarilla con el eslogan
  doc.setFillColor(...AMARILLO); doc.rect(0, 38, W, 8, 'F');
  const esl = pdfTxt(CFG.ESLOGAN || ''); const cs = 1.1;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(8.8); doc.setTextColor(...NEGRO);
  const ew = doc.getTextWidth(esl) + cs * Math.max(0, esl.length - 1);
  doc.text(esl, (W - ew) / 2, 43.3, {charSpace:cs});
  // Datos de la empresa
  const info = [CFG.NIT_EMPRESA && 'NIT ' + CFG.NIT_EMPRESA, CFG.DIRECCION_EMPRESA, CFG.TELEFONO_EMPRESA && 'Tel. ' + CFG.TELEFONO_EMPRESA, CFG.CORREO_EMPRESA].filter(Boolean).join('   ·   ');
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(95);
  if (info) doc.text(pdfTxt(info), W / 2, 51, {align:'center'});
  doc.setTextColor(30);
  return {doc, y: info ? 56 : 52, W};
}
function docDatos(doc, y, pares) {

  doc.autoTable({startY:y, body:filas, theme:'plain', margin:{left:14, right:14}, styles:{fontSize:8.8, cellPadding:1.1, textColor:30},
    columnStyles:{0:{fontStyle:'bold', textColor:[17, 17, 17], cellWidth:27}, 2:{fontStyle:'bold', textColor:[17, 17, 17], cellWidth:27}}});

}
function docTabla(doc, y, head, body, right) {

  const lines = doc.splitTextToSize(pdfTxt(texto), W - 34);
  if (y + lines.length * 4.6 + 8 > doc.internal.pageSize.getHeight() - 18) { doc.addPage(); y = 20; }
  doc.setFillColor(...(color === 'rojo' ? [252, 228, 226] : [238, 242, 246])); doc.setDrawColor(...(color === 'rojo' ? [176, 40, 32] : [180, 190, 200]));
  doc.roundedRect(14, y, W - 28, lines.length * 4.6 + 6, 1.5, 1.5, 'FD');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...(color === 'rojo' ? [160, 30, 25] : [50, 60, 70]));
  doc.text(lines, 17, y + 5.5);
  doc.setFont('helvetica', 'normal'); doc.setTextColor(30);
  return y + lines.length * 4.6 + 11;
}
function docTotal(doc, y, total) {
  const W = doc.internal.pageSize.getWidth();
  const txt = pdfMoney(total);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
  const tw = doc.getTextWidth('TOTAL   ' + txt) + 8;
  doc.setFillColor(...NEGRO); doc.rect(W - 14 - tw, y - 5.5, tw, 8.5, 'F');
  doc.setFillColor(...ROJO); doc.rect(W - 14 - tw, y - 5.5, 1.6, 8.5, 'F');
  doc.setTextColor(...AMARILLO); doc.text('TOTAL', W - 14 - tw + 5, y);
  doc.setTextColor(255); doc.text(txt, W - 18, y, {align:'right'});
  y += 4;
  doc.setFont('helvetica', 'normal'); doc.setTextColor(30);
  return y + 8;
}
function docFirmas(doc, y, a, b) {
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  if (y + 26 > H - 16) { doc.addPage(); y = 30; }
  y += 18; doc.setDrawColor(120); doc.setLineWidth(.3);
  doc.line(14, y, W / 2 - 8, y); doc.line(W / 2 + 8, y, W - 14, y);
  doc.setFontSize(8); doc.setTextColor(90); doc.text(pdfTxt(a), 14, y + 4); doc.text(pdfTxt(b), W / 2 + 8, y + 4);
  return y + 10;
}
function docPie(doc) {
  const n = doc.getNumberOfPages(), W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i);
    doc.setFillColor(...ROJO); doc.rect(14, H - 13, W - 28, .6, 'F');
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(120);
    doc.text(pdfTxt(`${CFG.EMPRESA} · Generado ${fdt(new Date())}`), 14, H - 8.5);
    doc.text(`Página ${i} de ${n}`, W - 14, H - 8.5, {align:'right'});
  }
}

async function mostrarPDF(constructor, nombre) {
  modal('<div class="loading">Generando PDF…</div>');
  const doc = await constructor();
  const blob = doc.output('blob');
  const url = URL.createObjectURL(blob);
  st.pdf = {blob, nombre, url};
  const movil = matchMedia('(pointer:coarse)').matches;
  modal(`<div class="modal-h"><div><h2>${esc(nombre)}</h2><div class="small muted">PDF listo para descargar o compartir</div></div><button class="btn sm" data-act="cerrar">Cerrar</button></div>
  <div class="modal-b">${movil ? '' : `<iframe class="pdf-frame" src="${url}" title="Vista previa del PDF"></iframe>`}
  <div class="row"><button class="btn primary big" data-act="compartirPDF" style="flex:1">⬇️ Descargar / Enviar PDF</button><a class="btn big" href="${url}" target="_blank" rel="noopener">Abrir</a></div></div>`);
}
function compartirPDF() {
  const {blob, nombre} = st.pdf;
  const archivo = new File([blob], nombre, {type:'application/pdf'});
  const movil = matchMedia('(pointer:coarse)').matches;
  if (movil && navigator.canShare && navigator.canShare({files:[archivo]})) {
    navigator.share({files:[archivo], title:nombre}).catch(e => { if (e.name !== 'AbortError') descargar(blob, nombre); });
    return;
  }
  descargar(blob, nombre);
}
function descargar(blob, nombre) {
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('PDF descargado.');
}

async function guardarCotizacion(enviar) {
  const d = st.draft;
  if (!d.cliente_id) fail('Selecciona el cliente de la lista (búscalo por nombre o NIT).');
  if (!d.lineas.length) fail('Agrega al menos un producto.');
  d.lineas.forEach(l => { if (!(parseNum(l.cantidad) > 0)) fail(`Revisa la cantidad de ${l.descripcion}.`); if (!(parseNum(l.precio) >= 0)) fail(`Escribe el precio de ${l.descripcion}.`); });
  const res = await rpc('guardar_pedido', {p_id:d.id || null, p_datos:{cliente_id:d.cliente_id, direccion:d.direccion, forma_pago:d.forma_pago, observaciones:d.observaciones, lista:d.lista || 'contado'},
    p_lineas:d.lineas.map(l => ({codigo:l.codigo, descripcion:l.descripcion, ue:ueDe(l), cantidad:parseNum(l.cantidad), precio:parseNum(l.precio)})), p_confirmar:false});
  st.draft = draftVacio(); guardarDraft();
  await cargar();
  st.tab = 'cot'; render(true); window.scrollTo(0, 0);
  if (enviar) { await enviarBodega(res.id); return; }

  const p = ped(res.id); if (p) await mostrarPDF(() => pdfCotizacion(p), `${p.cot_numero}.pdf`);
}

// El vendedor confirma: cómo se entrega, prioridad y hora (obligatoria si es Urgente)
async function enviarBodega(id) {
  const p = ped(id); if (!p) fail('No encontré la cotización.');
  let v = {entrega:p.tipo_entrega || 'Domicilio', direccion:p.direccion || '', prioridad:p.prioridad || 'Hoy', hora:p.hora_entrega ? new Date(p.hora_entrega).toTimeString().slice(0, 5) : ''};
  let r, error = '';
  for (;;) {
    r = await pedir({titulo:'📦 Enviar ' + esc(p.cot_numero) + ' a bodega',
      texto:`<b>${esc(p.cliente_nombre)}</b> · ${lins(p).length} producto(s) · <b>${money(totalPed(p))}</b>${error ? `<div class="notice bad" style="margin-top:8px">${esc(error)}</div>` : ''}`,
      campos:[
        {id:'entrega', label:'¿Cómo se entrega?', type:'select', value:v.entrega, options:[['Domicilio', '🚚 Domicilio: se lleva al cliente'], ['Recoge en bodega', '🏪 El cliente recoge en bodega']]},
        {id:'direccion', label:'Dirección del domicilio', value:v.direccion},
        {id:'prioridad', label:'Prioridad', type:'select', value:v.prioridad, options:[['Urgente', '🔴 Urgente: pasa de primero en bodega'], ['Hoy', '🟡 Hoy'], ['Ruta', '🟢 Ruta']]},
        {id:'hora', label:'Hora de entrega (obligatoria si es Urgente; si la hora ya pasó, queda para mañana)', type:'time', value:v.hora}
      ], boton:'📦 Enviar a bodega'});
    if (!r) { toast('La cotización quedó guardada. Puedes enviarla a bodega desde Mis cotizaciones.'); return; }
    v = r;
    error = r.prioridad === 'Urgente' && !r.hora ? 'Un pedido Urgente necesita la hora de entrega.'
      : r.entrega === 'Domicilio' && !r.direccion.trim() ? 'Escribe la dirección del domicilio.' : '';
    if (!error) break;
  }
  let hora = null;
  if (r.hora) { const [h, m] = r.hora.split(':').map(Number); const t = new Date(); t.setHours(h, m, 0, 0); if (t < Date.now() - 30 * 60000) t.setDate(t.getDate() + 1); hora = t.toISOString(); }
  await upd('pedidos', p.id, {tipo_entrega:r.entrega, direccion:r.direccion.trim() || p.direccion, prioridad:r.prioridad, hora_entrega:hora, estado:'CONFIRMADO'});
  await cargar();
  const n = ped(p.id); st.tab = 'mis'; render(true); window.scrollTo(0, 0);
  toast(`📦 Pedido ${(n && n.numero) || ''} enviado a bodega${r.prioridad === 'Urgente' ? ' como 🔴 Urgente' : ''}.`);
}

/* =========================================================
   IMPORTAR EXCEL DE PRECIOS
   ========================================================= */
const colKey = s => norm(s).replace(/[^a-z0-9]/g, '');
// Qué es cada columna según su título
function tipoColumna(h) {
  const k = colKey(h); if (!k) return null;
  if (k === 'cod' || k.includes('codigo') || k === 'ref' || k === 'referencia' || k === 'sku') return 'codigo';
  if (k === 'ue' || k.includes('empaque') || k === 'unidadempaque') return 'empaque';
  if (k.includes('especial') || (k.includes('solo') && k.includes('sincelej') && k.includes('contado'))) return 'especial';
  if (k.includes('contadomunicipal')) return 'contado';
  if (k.includes('mostrador')) return /2/.test(k) ? 'mostrador2' : 'mostrador1';
  if (k.includes('credito')) return 'credito';
  if (k.includes('contado')) return 'contado';
  if (/^(categoria|seccion|linea|grupo)$/.test(k)) return 'categoria';
  if (/^(nota|notas|observacion|observaciones)$/.test(k)) return 'nota';
  if (/descrip|^producto|^nombre|^articulo|^detalle/.test(k)) return 'descripcion';
  if (/^(precio|valor|pvp|preciogeneral|preciopublico|preciolista)$/.test(k)) return 'contado';
  return null;
}
function leerPrecio(v) {
  if (typeof v === 'number') return v;
  let t = String(v ?? '').replace(/[$\s]|COP|cop/g, '');
  if (!t) return NaN;
  if (/,\d{1,2}$/.test(t)) t = t.replace(/\./g, '').replace(',', '.');
  else if (/\.\d{1,2}$/.test(t) && !/\.\d{3}\./.test(t)) t = t.replace(/,/g, '');
  else t = t.replace(/[.,]/g, '');
  return Number(t);
}
// Lee el Excel por secciones: cada vez que aparece una fila de títulos, cambia el mapa de columnas
function analizarHoja(filas) {
  const out = [], vistos = new Map(); let map = null, seccion = '', titulos = 0;
  for (let r = 0; r < filas.length; r++) {
    const row = filas[r].map(x => typeof x === 'string' ? x.trim() : x);
    const llenas = row.map((v, i) => [v, i]).filter(([v]) => v !== '' && v != null);
    if (!llenas.length) continue;
    const tipos = row.map(v => typeof v === 'string' ? tipoColumna(v) : null);
    const precios = tipos.filter(t => TIERS.some(([k]) => k === t)).length;
    if (precios && (tipos.includes('codigo') || tipos.includes('descripcion'))) {
      map = {}; titulos++;
      tipos.forEach((t, i) => { if (t && map[t] == null) { map[t] = i; vistos.set(String(row[i]).replace(/\s+/g, ' '), t); } });
      if (map.descripcion == null) { // la columna de descripción a veces se llama como la sección
        const desde = (map.codigo ?? -1) + 1;
        for (let i = desde; i < row.length; i++) if (row[i] !== '' && row[i] != null && tipos[i] == null) { map.descripcion = i; break; }
      }
      continue;
    }
    if (llenas.length === 1 && typeof llenas[0][0] === 'string' && (!map || llenas[0][1] <= (map.codigo ?? map.descripcion))) { seccion = llenas[0][0]; continue; }
    if (!map || map.descripcion == null) continue;
    const d = String(row[map.descripcion] ?? '').trim(); const c = map.codigo != null ? String(row[map.codigo] ?? '').trim() : '';
    if (!d) continue;
    const item = {fila:r + 1, codigo:c, descripcion:d, categoria:seccion, empaque:map.empaque != null ? String(row[map.empaque] ?? '').trim() : '', nota:''};
    const notas = [];
    TIERS.forEach(([t]) => {
      if (map[t] == null) { item[t] = null; return; }
      const v = row[map[t]]; const n = leerPrecio(v);
      item[t] = n > 0 ? Math.round(n) : null;
      if (typeof v === 'string' && v.trim() && !(n > 0)) notas.push(v.trim());
    });
    if (map.nota != null && row[map.nota]) notas.push(String(row[map.nota]).trim());
    if (map.categoria != null && row[map.categoria]) item.categoria = String(row[map.categoria]).trim();
    item.nota = [...new Set(notas)].join(' · ');
    out.push(item);
  }
  return {items:out, titulos, columnas:[...vistos.entries()]};
}
async function leerExcel(file) {
  if (!window.XLSX) fail('No se pudo cargar el lector de Excel. Recarga la página.');
  toast('Leyendo ' + file.name + '…');
  const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
  let mejor = null;
  for (const nombre of wb.SheetNames) {
    const filas = XLSX.utils.sheet_to_json(wb.Sheets[nombre], {header:1, defval:'', raw:true, blankrows:true});
    const a = analizarHoja(filas);
    if (a.items.length && (!mejor || a.items.length > mejor.items.length)) mejor = {...a, hoja:nombre};
  }
  if (!mejor) fail('No encontré filas de títulos con "Código" o "Descripción" y al menos una columna de precio (contado, crédito o mostrador). Revisa el archivo o mándalo a soporte.');
  st.imp = {file, ...mejor, retirar:false};
  mostrarImport();
}
function datosImport() {
  const uniq = new Map(); let repetidas = 0;
  st.imp.items.forEach(x => { const k = x.codigo + '|' + x.descripcion; if (uniq.has(k)) repetidas++; uniq.set(k, x); });
  const datos = [...uniq.values()];
  return {datos, malas:[], repetidas, sinPrecio:datos.filter(x => TIERS.every(([t]) => x[t] == null))};
}
function mostrarImport() {
  const I = st.imp; const {datos, repetidas, sinPrecio} = datosImport();

  const existentes = new Map(st.productos.map(p => [p.codigo + '|' + p.descripcion, p]));
  const nuevos = datos.filter(x => !existentes.has(x.codigo + '|' + x.descripcion)).length;

  const noEstan = st.productos.filter(p => !llaves.has(p.codigo + '|' + p.descripcion)).length;
  const secciones = [...new Set(datos.map(x => x.categoria).filter(Boolean))];
  const ej = datos.filter((x, i) => i < 4 || x.nota || TIERS.every(([t]) => x[t] == null)).slice(0, 8);
  modal(`<div class="modal-h"><div><h2>Revisar Excel antes de guardar</h2><div class="small muted">${esc(I.file.name)} · hoja "${esc(I.hoja)}" · ${I.titulos} encabezados · ${secciones.length} secciones</div></div><button class="btn sm" data-act="cerrar">Cancelar</button></div>
  <div class="modal-b">
    <div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">
      <div class="tile" style="--tone:var(--ok)"><span>Productos</span><b>${datos.length}</b></div>
      <div class="tile" style="--tone:var(--blue)"><span>Nuevos</span><b>${nuevos}</b></div>
      <div class="tile" style="--tone:var(--warn)"><span>Cambian de precio</span><b>${cambian}</b></div>
      <div class="tile" style="--tone:var(--bad)"><span>Sin ningún precio</span><b>${sinPrecio.length}</b></div>
    </div>
    <details><summary class="small" style="cursor:pointer"><b>Cómo leí las columnas</b> (revisa que sea correcto)</summary><div class="tbl" style="margin-top:6px"><table><tbody>${I.columnas.map(([h, t]) => `<tr><td>${esc(h)}</td><td>→ <b>${t === 'codigo' ? 'Código' : t === 'descripcion' ? 'Descripción' : t === 'empaque' ? 'U/E' : t === 'categoria' ? 'Sección' : t === 'nota' ? 'Nota' : tierNombre(t)}</b></td></tr>`).join('')}</tbody></table></div></details>
    <div class="tbl"><table><thead><tr><th>Código</th><th style="min-width:240px">Descripción</th>${TIERS.map(([, t]) => `<th class="num">${t}</th>`).join('')}<th>U/E</th></tr></thead><tbody>
      ${ej.map(x => `<tr><td class="mono">${esc(x.codigo)}</td><td>${esc(x.descripcion)}${x.nota ? ` <span class="chip bad">${esc(x.nota)}</span>` : ''}<div class="small muted">${esc(x.categoria)}</div></td>${TIERS.map(([t]) => `<td class="num">${x[t] == null ? '<span class="muted">—</span>' : money(x[t])}</td>`).join('')}<td class="num">${esc(x.empaque)}</td></tr>`).join('')}
    </tbody></table></div>
    ${sinPrecio.length ? `<details><summary class="small" style="cursor:pointer">${sinPrecio.length} productos sin ningún precio: se guardan en el catálogo marcados "sin precio"</summary><div class="small muted" style="margin-top:6px">${sinPrecio.map(x => `${esc(x.codigo)} ${esc(x.descripcion)}`).join('<br>')}</div></details>` : ''}
    ${repetidas ? `<div class="small muted">${repetidas} fila(s) repetidas con el mismo código y descripción: se tomó la última.</div>` : ''}
    ${noEstan && st.productos.length ? `<label class="row" style="font-weight:500"><input type="checkbox" data-imp="retirar" ${I.retirar ? 'checked' : ''}> Retirar ${noEstan} producto(s) de la app que no están en este Excel</label>` : ''}
    <div class="row end"><button class="btn primary big" data-act="confirmarImport" ${datos.length ? '' : 'disabled'}>💾 Guardar ${datos.length} productos</button></div>
  </div>`);
}

  if (el.dataset.imp === 'retirar') st.imp.retirar = el.checked;
});
async function confirmarImport() {
  const I = st.imp; const {datos, malas} = datosImport();
  if (!datos.length) fail('No hay productos válidos para guardar.');
  modal('<div class="loading">Guardando lista de precios…</div>', true);
  // 1. guardar el archivo original
  let ruta = null, avisoArchivo = '';
  try {
    const limpio = I.file.name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.-]+/g, '_');
    const path = `${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}_${limpio}`;
    const up = await sb.storage.from('listas-precios').upload(path, I.file, {contentType:I.file.type || 'application/octet-stream'});
    if (up.error) throw up.error; ruta = path;
  } catch (e) { avisoArchivo = 'Los precios se guardaron, pero el archivo no se pudo archivar (' + (e.message || e) + '). Vuelve a ejecutar schema.sql en Supabase.'; }
  // 2. actualizar precios
  let tot = {nuevos:0, actualizados:0, omitidas:0}, retirados = 0;
  for (let i = 0; i < datos.length; i += 400) {
    const r = await rpc('importar_productos', {p_filas:datos.slice(i, i + 400).map(({fila, ...x}) => x)});
    tot.nuevos += r.nuevos; tot.actualizados += r.actualizados; tot.omitidas += r.omitidas;
  }
  // 3. retirar los que no están
  if (I.retirar) {
    const llaves = new Set(datos.map(x => x.codigo + '|' + x.descripcion));
    const ids = st.productos.filter(p => !llaves.has(p.codigo + '|' + p.descripcion)).map(p => p.id);
    for (let i = 0; i < ids.length; i += 200) { const {error} = await sb.from('productos').update({activo:false}).in('id', ids.slice(i, i + 200)); if (error) fail(error.message); }
    retirados = ids.length;
  }
  // 4. dejar registro
  await sb.from('importaciones').insert({archivo:I.file.name, ruta, filas:datos.length, nuevos:tot.nuevos, actualizados:tot.actualizados, omitidas:tot.omitidas, retirados});
  st.imp = null;
  await cargarCatalogos(); render(true);
  modal(`<div class="modal-h"><h2>✅ Lista de precios actualizada</h2><button class="btn sm" data-act="cerrar">Listo</button></div>
  <div class="modal-b"><div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">
    <div class="tile" style="--tone:var(--blue)"><span>Nuevos</span><b>${tot.nuevos}</b></div>
    <div class="tile" style="--tone:var(--ok)"><span>Actualizados</span><b>${tot.actualizados}</b></div>
    <div class="tile" style="--tone:var(--warn)"><span>Omitidas</span><b>${tot.omitidas}</b></div>
    <div class="tile" style="--tone:var(--bad)"><span>Retirados</span><b>${retirados}</b></div></div>
    <div>Ahora hay <b>${st.productos.length}</b> productos activos. Los pedidos ya confirmados conservan su precio.</div>
    ${avisoArchivo ? `<div class="notice">${esc(avisoArchivo)}</div>` : '<div class="small muted">El archivo quedó guardado en "Excel subidos".</div>'}
  </div>`, true);
}

/* =========================================================
   EVENTOS
   ========================================================= */
document.addEventListener('click', async e => {
  if (!e.target.closest('.ac')) document.querySelectorAll('.dropdown').forEach(x => x.hidden = true);
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'fondo') { if (e.target === b) cerrarModal(null); return; }
  if (!H[a]) return;
  if (b.tagName === 'BUTTON' && b.type !== 'submit') e.preventDefault();
  if (a === 'compartirPDF') { try { H[a](b.dataset); } catch (err) { toast(err.message, 'bad'); } return; }
  const wasDisabled = b.disabled; b.disabled = true;
  try { await H[a](b.dataset); }
  catch (err) { console.error(err); toast(err.message || 'Ocurrió un error.', 'bad'); if (/JWT|session/i.test(err.message || '')) salir('Tu sesión expiró. Vuelve a entrar.'); }
  finally { if (document.body.contains(b)) b.disabled = wasDisabled; }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'cli-q') {
    st.draft.cliente_txt = el.value; const c = cliente(st.draft.cliente_id); if (c && c.nombre !== el.value) st.draft.cliente_id = null;
    const q = norm(el.value).split(/\s+/).filter(Boolean);
    const res = q.length ? st.clientes.filter(c => q.every(w => norm(c.nombre + ' ' + c.nit + ' ' + c.contacto).includes(w))).slice(0, 8) : [];
    const box = $('#cli-res');
    box.innerHTML = res.length ? res.map(c => `<button type="button" data-act="pickCli" data-id="${c.id}"><b>${esc(c.nombre)}</b><div class="small muted">NIT ${esc(c.nit || '—')} · ${esc(c.direccion || '')} ${esc(c.municipio || '')}</div></button>`).join('') : (q.length ? '<button type="button" data-act="clienteForm">➕ No existe. Crear cliente nuevo</button>' : '');
    box.hidden = !q.length; guardarDraft(); return;
  }
  if (el.id === 'prod-q') {
    const q = norm(el.value).split(/\s+/).filter(Boolean); const t = st.draft.lista || 'contado';
    const res = q.length ? st.productos.filter(p => q.every(w => norm(p.codigo + ' ' + p.descripcion + ' ' + (p.categoria || '')).includes(w))).slice(0, 15) : [];
    const box = $('#prod-res');
    box.innerHTML = res.length ? res.map(p => `<button type="button" data-act="pickProd" data-id="${p.id}"><span class="mono small">${esc(p.codigo)}</span> · <b>${esc(p.descripcion)}</b> <span class="muted">· ${precioTier(p, t) == null ? '<span style="color:var(--bad)">sin precio' + (p.nota ? ' · ' + esc(p.nota) : '') + '</span>' : money(precioTier(p, t))}${p.empaque && p.empaque !== '1' ? ' · U/E ' + esc(p.empaque) : ''}</span></button>`).join('') : (q.length ? '<div class="empty">Sin resultados. Gerencia puede agregarlo en Precios.</div>' : '');
    box.hidden = !q.length; return;
  }
  if (el.dataset.draft) { st.draft[el.dataset.draft] = el.value; guardarDraft(); return; }
  if (el.dataset.lf) {
    const i = Number(el.dataset.i); const l = st.draft.lineas[i]; l[el.dataset.lf] = el.value; l.ue = ueDe(l);
    if (el.dataset.lf === 'empaques') { const n = parseNum(el.value); l.cantidad = n > 0 ? +(n * l.ue).toFixed(2) : ''; const u = document.getElementById('lq-' + i); if (u) u.value = l.cantidad; }
    if (el.dataset.lf === 'cantidad') { const n = parseNum(el.value); l.empaques = n > 0 ? +(n / l.ue).toFixed(2) : ''; const e2 = document.getElementById('le-' + i); if (e2) e2.value = l.empaques; }
    guardarDraft(); const hint = document.getElementById('lpl-' + i); if (hint) hint.hidden = !(l.precio_lista != null && parseNum(l.precio) !== Number(l.precio_lista)); const t = document.getElementById('lt-' + i); if (t) t.textContent = money(parseNum(l.cantidad) * parseNum(l.precio));
    const tot = document.getElementById('np-total'); if (tot) tot.textContent = money(st.draft.lineas.reduce((a, x) => a + parseNum(x.cantidad) * parseNum(x.precio), 0));
    return;
  }
  if (el.dataset.ui && el.tagName === 'INPUT') {
    st.ui[el.dataset.ui] = el.value;
    if (/^d[cv]-/.test(el.dataset.ui)) return;
    const pos = el.selectionStart; render(true); const n = document.getElementById(el.id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} }
  }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.draft && el.tagName === 'SELECT') { st.draft[el.dataset.draft] = el.value; if (el.dataset.draft === 'lista') { reprecio(el.value); render(true); } guardarDraft(); return; }
  if (el.dataset.ui && el.tagName === 'SELECT') { st.ui[el.dataset.ui] = el.value; render(true); return; }
  if (el.dataset.precio) {
    const v = el.value.trim() === '' ? null : parseNum(el.value);
    if (v != null && !(v > 0)) { toast('Escribe un precio mayor que cero, o déjalo vacío.', 'bad'); return; }
    try { await upd('productos', Number(el.dataset.precio), {[el.dataset.campo]:v, updated_at:new Date().toISOString()}); const p = st.productos.find(x => x.id === Number(el.dataset.precio)); p[el.dataset.campo] = v; toast('Precio actualizado.'); }
    catch (err) { toast(err.message, 'bad'); }
    return;
  }
  if (el.id === 'xls' && el.files[0]) {
    const file = el.files[0]; el.value = '';
    try { await leerExcel(file); } catch (err) { toast(err.message, 'bad'); }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal-root').innerHTML) cerrarModal(null); });
setInterval(() => { if (st.me && ['gerencia','bodega','despacho','verif'].includes(st.tab) && !$('#modal-root').innerHTML) render(); }, 30000);

/* =========================================================
   ARRANQUE
   ========================================================= */
(async () => {
  if (!configurado) { render(true); return; }
  try {
    const {data} = await sb.auth.getSession();
    if (data.session) await iniciar(data.session.user); else render(true);
  } catch (e) { render(true); toast(e.message, 'bad'); }
})();
</script>
